# Project-scoped workflow. Keep the user's selected model and provider.
model_reasoning_effort = "high"
web_search = "live"
project_doc_max_bytes = 65536
approval_policy = "never"
sandbox_mode = "danger-full-access"

developer_instructions = '''
This is the Tutorials repository. Read complete PROMPT.md and AGENTS.md.
Shared teaching and workflow rules live in .tutorial/QUALITY.md and
.tutorial/WORKFLOW.md. JavaScript is the editorial benchmark. Apply PROMPT section
5 and QUALITY section 6 for topic-specific official/practitioner research, varied
curriculum inputs, primary-evidence checks and canonical cross-links.
No fixed domain count or punctuation quota.

Route actual tutorial tasks to .codex/skills/tutorial/SKILL.md (propose),
.codex/skills/tutorial-continue/SKILL.md (recover), or
.codex/skills/tutorial-review/SKILL.md (report first). Native invocations are
$tutorial, $tutorial-continue, $tutorial-review. Preserve trailing scope. If the
corresponding slash command arrives as ordinary text, route it likewise.
Discussion or configuration of commands never authorizes tutorial work.

A new track needs a presented curriculum and user approval before authoring.
A quality review needs a presented report and user approval before repairs.
Continue preserves pending gates and already approved scope. Read the complete
selected track LOG plus Git/disk; recover the same phase, revision, approval and
remaining plan after compaction. Never use maintenance logs or deleted tracks'
old history as continuation. Never automatically start the next root track.

For approved execution, finish one leaf with affected indexes, actually verify,
update the active LOG immediately and commit only that unit before proceeding.
Continue the full approved plan across domains; close the log before normal exit.
The optional tutorial_executor handles one explicitly assigned approved unit;
the coordinator owns logs, review and commits. Direct execution is sufficient.
Repository policy/integration maintenance is logged in MAINTENANCE_LOG.md.
Historical .codex/LOG.md is not a tutorial recovery candidate. Shared and OpenCode
rules may be changed when the user requests cross-agent workflow maintenance.
'''
